site_name: Immich ReverseGeo
site_description: Reverse geocoding companion for Immich photo assets
site_url: https://immich-reversegeo.github.io/
repo_url: https://github.com/immich-reversegeo/immich-reversegeo
repo_name: immich-reversegeo/immich-reversegeo
edit_uri: edit/master/docs/website/
docs_dir: docs/website
site_dir: _out/website
use_directory_urls: true
strict: true
exclude_docs: |
  /requirements.txt

validation:
  invalid_links: true
  invalid_link_anchors: true

theme:
  variant: modern
  language: en
  logo: assets/images/logo-mark.svg
  favicon: assets/images/favicon.svg
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.footer
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - content.action.edit
    - content.action.copy
    - content.tabs.link
    - content.code.copy
    - toc.follow
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/external-links.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - tables
  - pymdownx.highlight
  - pymdownx.snippets:
      check_paths: true
      base_path:
        - .
  - pymdownx.superfences
  - toc:
      permalink: true

plugins:
  - glightbox:
      manual: true
      auto_caption: true
  - search
  - social:
      cards_layout_options:
        background_color: "#141426"
        color: "#FFFFFF"
  - llmstxt:
      sections:
        Overview:
          - index.md
          - architecture.md
        Setup:
          - getting-started.md
          - installation.md
          - configuration.md
        Guides:
          - using-the-app.md
          - data-sources.md
        Help:
          - troubleshooting.md
          - support.md
        Releases:
          - changelog.md

nav:
  - Home: index.md
  - Setup:
      - Getting Started: getting-started.md
      - Installation: installation.md
      - Configuration: configuration.md
  - Guide / App:
      - Using the App: using-the-app.md
      - Data Sources: data-sources.md
      - Architecture: architecture.md
      - Changelog: changelog.md
  - Help:
      - Troubleshooting: troubleshooting.md
      - Support: support.md
  - Legal:
      - Privacy: privacy.md
      - Terms of Service: tos.md
