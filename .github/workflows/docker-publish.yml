name: Publish Docker Image

on:
  release:
    types: [published]
  workflow_call:
  workflow_dispatch:
    inputs:
      publish_latest:
        description: "Publish latest in addition to sha tag"
        required: false
        default: false
        type: boolean
      existing_release:
        description: "Recovery only: published stable release tag to promote without rebuilding"
        required: false
        default: ""
        type: string
      existing_digest:
        description: "Recovery only: exact published sha256 digest"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: ${{ !inputs.existing_digest && !inputs.existing_release }}
    runs-on: ubuntu-latest
    outputs:
      image: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/immich-reversegeo
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=raw,value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=raw,value=edge,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
            type=sha,prefix=sha-

      - name: Validate release version
        if: github.event_name == 'release'
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          IMAGE_METADATA: ${{ steps.meta.outputs.json }}
        with:
          script: |
            const { validateReleaseTag } = require('./.github/scripts/docker-publishing.cjs');
            validateReleaseTag(process.env.RELEASE_TAG, JSON.parse(process.env.IMAGE_METADATA));

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./src/ImmichReverseGeo.Web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  promote-latest:
    needs: publish
    if: ${{ always() && !cancelled() && ((needs.publish.result == 'success' && ((github.event_name == 'release' && !github.event.release.prerelease && !contains(github.event.release.tag_name, '-')) || (github.event_name == 'workflow_dispatch' && inputs.publish_latest == true))) || (github.event_name == 'workflow_dispatch' && inputs.publish_latest == true && inputs.existing_release != '' && inputs.existing_digest != '')) }}
    runs-on: ubuntu-latest
    concurrency:
      group: docker-latest-promotion
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote built image to latest
        uses: actions/github-script@v9
        env:
          MANUAL_PROMOTION: ${{ inputs.publish_latest }}
          SOURCE_IMAGE: ${{ inputs.existing_digest != '' && format('ghcr.io/{0}/immich-reversegeo:{1}', github.repository_owner, inputs.existing_release) || needs.publish.outputs.image }}
          SOURCE_DIGEST: ${{ inputs.existing_digest || needs.publish.outputs.digest }}
          EXISTING_RELEASE: ${{ inputs.existing_release }}
        with:
          script: |
            const { promoteLatest, recoveryContext } = require('./.github/scripts/docker-publishing.cjs');
            const promotionContext = process.env.EXISTING_RELEASE
              ? await recoveryContext({ context, exec, tag: process.env.EXISTING_RELEASE, image: process.env.SOURCE_IMAGE, digest: process.env.SOURCE_DIGEST })
              : context;
            await promoteLatest({
              github, context: promotionContext, core, exec,
              image: process.env.SOURCE_IMAGE,
              digest: process.env.SOURCE_DIGEST,
              manual: process.env.MANUAL_PROMOTION === 'true'
            });
