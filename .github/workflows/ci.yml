name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  app:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Test Docker publishing rules
        run: node --test .github/scripts/docker-publishing.test.cjs

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore immich-reversegeo.slnx

      - name: Build
        run: dotnet build immich-reversegeo.slnx --configuration Release --no-restore

      - name: Compile local Immich database harness
        run: dotnet build tests/LiveImmichDb/LiveImmichDb.csproj --configuration Release

      - name: Compile geographic workload harness
        run: dotnet build tests/GeographicWorkload/GeographicWorkload.csproj --configuration Release

      - name: Test
        run: dotnet test --solution immich-reversegeo.slnx --configuration Release --no-build --filter "TestCategory!=Integration&TestCategory!=Performance"

      - name: Build Docker image
        run: docker build -f src/ImmichReverseGeo.Web/Dockerfile -t immich-reversegeo:test .

  publish:
    name: Publish validated master image
    needs: app
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
