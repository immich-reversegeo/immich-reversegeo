name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  app:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Test Docker publishing rules
        run: node --test .github/scripts/docker-publishing.test.cjs

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore immich-reversegeo.slnx

      - name: Build
        run: dotnet build immich-reversegeo.slnx --configuration Release --no-restore

      - name: Compile local Immich database harness
        run: dotnet build tests/LiveImmichDb/LiveImmichDb.csproj --configuration Release

      - name: Compile geographic workload harness
        run: dotnet build tests/GeographicWorkload/GeographicWorkload.csproj --configuration Release

      - name: Test
        run: dotnet test --solution immich-reversegeo.slnx --configuration Release --no-build --filter "TestCategory!=Integration&TestCategory!=Performance"

      - name: Setup Node for browser tests
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install browser test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test frontend workflows
        run: npm run test:frontend

      - name: Upload browser test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-test-results
          path: |
            _out/frontend-tests/report/
            _out/frontend-tests/results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build Docker image
        run: docker build -f src/ImmichReverseGeo.Web/Dockerfile -t immich-reversegeo:test .

  database:
    name: Immich database contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test disposable Immich stacks
        run: npm run test:database -- --configuration Release

      - name: Upload database test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: immich-database-contracts
          path: |
            _out/testcontainers/reversegeo/**/*.trx
            _out/testcontainers/reversegeo/**/*-results.json
            _out/testcontainers/reversegeo/**/*-database.log
            _out/testcontainers/reversegeo/**/*-redis.log
            _out/testcontainers/reversegeo/**/*-server.log
          include-hidden-files: true
          if-no-files-found: ignore

  publish:
    name: Publish validated master image
    needs: [app, database]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
